<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Royal Birthday Celebration ✨</title>

    <!-- Canvas Confetti & Fonts -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #2d0b32, #120318, #05010a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px 10px;
            color: #f3e5f5;
        }

        /* Ambient Sparkles Background */
        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffd700, 0 0 20px #ff69b4;
            animation: floatUp 8s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* ---------------------------------------------------- */
        /* LAYAR AWAL: KADO KEJUTAN ELEGAN                     */
        /* ---------------------------------------------------- */
        #gift-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #3b1044 0%, #0c0211 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
            text-align: center;
        }

        .luxury-box {
            font-size: 90px;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.6));
            animation: boxFloat 2s ease-in-out infinite alternate;
            transition: transform 0.3s;
        }

        .luxury-box:hover {
            transform: scale(1.15) rotate(5deg);
        }

        @keyframes boxFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-20px); }
        }

        .overlay-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: #d4af37;
            margin-top: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .overlay-subtitle {
            font-size: 0.9rem;
            color: #e0b0ff;
            margin-top: 8px;
            font-weight: 300;
        }

        /* ---------------------------------------------------- */
        /* KARTU CONTAINER UTAMA                                */
        /* ---------------------------------------------------- */
        .main-card {
            display: none;
            background: rgba(30, 10, 40, 0.75);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 0 50px rgba(186, 85, 211, 0.2), inset 0 0 20px rgba(212, 175, 55, 0.1);
            border-radius: 30px;
            padding: 35px 25px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: cardAppear 1s ease forwards;
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Avatar Utama */
        .avatar-frame {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(45deg, #d4af37, #ff69b4, #d4af37);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            animation: rotateGlow 6s linear infinite;
        }

        @keyframes rotateGlow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .avatar-frame img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        h1.title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            background: linear-gradient(45deg, #ffe600, #ffb3ec, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        /* ---------------------------------------------------- */
        /* AUTOSCROLL ALBUM FOTO                                 */
        /* ---------------------------------------------------- */
        .album-section {
            margin: 25px 0;
        }

        .album-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #d4af37;
            margin-bottom: 10px;
        }

        .slider-container {
            width: 100%;
            overflow: hidden;
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
        }

        .slider-track {
            display: flex;
            width: 100%;
            transition: transform 0.6s ease-in-out;
        }

        .slide {
            min-width: 100%;
            height: 220px;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ---------------------------------------------------- */
        /* SESI KUE & TIUP LILIN                                */
        /* ---------------------------------------------------- */
        .cake-area {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            margin: 20px 0;
            cursor: pointer;
            transition: background 0.3s;
        }

        .cake-area:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .cake-icon {
            font-size: 60px;
            position: relative;
            display: inline-block;
        }

        .flame-anim {
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            animation: flameFlicker 0.4s infinite alternate;
        }

        @keyframes flameFlicker {
            0% { opacity: 1; transform: translateX(-50%) scale(1); }
            100% { opacity: 0.6; transform: translateX(-50%) scale(1.3); }
        }

        /* ---------------------------------------------------- */
        /* KOTAK KADO MULTI-SURPRISE                            */
        /* ---------------------------------------------------- */
        .gifts-grid {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }

        .gift-item {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            width: 30%;
            transition: all 0.3s;
        }

        .gift-item:hover {
            transform: translateY(-5px);
            background: rgba(212, 175, 55, 0.25);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .gift-icon { font-size: 30px; }
        .gift-label { font-size: 0.75rem; color: #ffe600; margin-top: 5px; }

        /* Popup Modal Kado */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #1e0a28;
            border: 2px solid #d4af37;
            padding: 25px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            animation: popModal 0.4s ease;
        }

        @keyframes popModal {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Typewriter Box */
        .message-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #f3e5f5;
            background: rgba(0, 0, 0, 0.3);
            padding: 18px;
            border-radius: 15px;
            border-left: 3px solid #d4af37;
            text-align: left;
            margin: 20px 0;
            min-height: 90px;
        }

        /* Form Wishbook */
        .wishbook {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 20px;
            border-radius: 20px;
            margin-top: 25px;
        }

        textarea {
            width: 100%;
            height: 75px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            padding: 10px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            resize: none;
            outline: none;
            margin-top: 10px;
        }

        .luxury-btn {
            background: linear-gradient(45deg, #d4af37, #aa7c11);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 10px 22px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            transition: all 0.3s;
        }

        .luxury-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
        }

        .wish-result {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: rgba(212, 175, 55, 0.15);
            border-radius: 10px;
            color: #ffd700;
            font-style: italic;
            font-size: 0.85rem;
        }

        #youtube-player {
            position: absolute;
            width: 1px; height: 1px;
            opacity: 0; pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Hidden YouTube Audio -->
    <div id="youtube-player"></div>

    <!-- Sparkle Particles Background -->
    <div id="sparkle-container"></div>

    <!-- 1. OVERLAY KADO KEJUTAN UTAMA -->
    <div id="gift-overlay" onclick="startExperience()">
        <div class="luxury-box">🎁</div>
        <div class="overlay-title">A Special Gift For You</div>
        <div class="overlay-subtitle">Ketuk kado di atas untuk membuka kejutan ✨</div>
    </div>

    <!-- 2. KARTU UTAMA ELEGAN -->
    <div class="main-card" id="mainCard">
        
        <!-- Foto Profile Utama -->
        <!-- Ganti URL di src dengan foto temanmu -->
        <div class="avatar-frame">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80" alt="Birthday Person">
        </div>

        <h1 classtitle">Happy Birthday! 🎉</h1>
        <p style="color: #d4af37; font-style: italic; font-size: 0.9rem;">Wishing you a day as extraordinary as you are ✨</p>

        <!-- ALBUM FOTO AUTO-SCROLL -->
        <div class="album-section">
            <div class="album-title">📸 Precious Memories</div>
            <div class="slider-container">
                <div class="slider-track" id="sliderTrack">
                    <!-- ========================================================= -->
                    <!-- LOKASI DAFTAR FOTO ALBUM (Ganti link src di bawah)       -->
                    <!-- ========================================================= -->
                    <div class="slide"><img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=600&q=80" alt="Slide 1"></div>
                    <div class="slide"><img src="https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?auto=format&fit=crop&w=600&q=80" alt="Slide 2"></div>
                    <div class="slide"><img src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=600&q=80" alt="Slide 3"></div>
                </div>
            </div>
        </div>

        <!-- SESI TIUP LILIN -->
        <div class="cake-area" onclick="blowCandle()">
            <div class="cake-icon">
                <span id="flame" class="flame-anim">🔥</span>🎂
            </div>
            <div id="cakeHint" style="font-size: 0.8rem; color: #ffd700; margin-top: 5px;">
                ✨ Ketuk kue untuk meniup lilinnya! 🌬️
            </div>
        </div>

        <!-- UCAPAN TYPEWRITER -->
        <div class="message-text" id="typewriterText"></div>

        <!-- 3 KOTAK KADO KEJUTAN (MYSTERY GIFTS) -->
        <div style="font-size: 0.85rem; color: #d4af37; margin-top: 15px;">🎁 Buka 3 Kado Rahasia Ini:</div>
        <div class="gifts-grid">
            <div class="gift-item" onclick="openGiftModal(1)">
                <div class="gift-icon">💎</div>
                <div class="gift-label">Kado #1</div>
            </div>
            <div class="gift-item" onclick="openGiftModal(2)">
                <div class="gift-icon">📜</div>
                <div class="gift-label">Kado #2</div>
            </div>
            <div class="gift-item" onclick="openGiftModal(3)">
                <div class="gift-icon">👑</div>
                <div class="gift-label">Kado #3</div>
            </div>
        </div>

        <!-- FORM WISHBOOK -->
        <div class="wishbook">
            <div style="color: #d4af37; font-size: 0.9rem;">✨ Wishbook Ulang Tahun</div>
            <textarea id="wishInput" placeholder="Tuliskan harapan & doamu di usia baru ini..."></textarea>
            <button class="luxury-btn" onclick="submitWish()">Simpan Harapan 🚀</button>
            <div id="wishDisplay" class="wish-result"></div>
        </div>
    </div>

    <!-- MODAL POPUP KEJUTAN -->
    <div class="modal" id="giftModal">
        <div class="modal-content">
            <div id="modalIcon" style="font-size: 50px;">🎁</div>
            <div id="modalTitle" style="color: #ffd700; font-family: 'Playfair Display', serif; font-size: 1.4rem; margin: 10px 0;"></div>
            <div id="modalBody" style="font-size: 0.9rem; color: #f3e5f5; line-height: 1.6;"></div>
            <button class="luxury-btn" style="margin-top: 20px;" onclick="closeGiftModal()">Tutup ✨</button>
        </div>
    </div>

    <!-- YouTube API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // 1. YouTube Player Integration
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                videoId: 'KnJ7oeJzXyo',
                playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': 'KnJ7oeJzXyo' }
            });
        }

        // 2. TEKS UCAPAN TYPEWRITER (Ubah Teks di Sini)
        const greetingText = "Selamat Ulang Tahun! ✨\n\nDi hari istimewa ini, semoga setiap langkahmu selalu dikelilingi kebahagiaan, kedamaian, dan kesuksesan yang berlimpah. Terima kasih telah menjadi sosok yang luar biasa dan selalu membawa kehangatan. Enjoy your magical day! 🥂💖";

        // Buka Pengalaman Utama
        function startExperience() {
            document.getElementById('gift-overlay').style.display = 'none';
            document.getElementById('mainCard').style.display = 'block';

            if (player && player.playVideo) { player.playVideo(); }

            triggerGoldConfetti();
            setTimeout(triggerGoldConfetti, 800);
            startTypewriter();
            startAlbumAutoScroll();
        }

        // Typewriter Effect
        let charIndex = 0;
        function startTypewriter() {
            if (charIndex < greetingText.length) {
                let char = greetingText.charAt(charIndex);
                document.getElementById("typewriterText").innerHTML += char === '\n' ? '<br>' : char;
                charIndex++;
                setTimeout(startTypewriter, 35);
            }
        }

        // Album Photo Auto Scroll Logic
        let currentSlide = 0;
        function startAlbumAutoScroll() {
            const track = document.getElementById('sliderTrack');
            const totalSlides = track.children.length;
            setInterval(() => {
                currentSlide = (currentSlide + 1) % totalSlides;
                track.style.transform = `translateX(-${currentSlide * 100}%)`;
            }, 3000); // Berganti setiap 3 detik
        }

        // Blow Candle Logic
        let candleOut = false;
        function blowCandle() {
            const flame = document.getElementById('flame');
            const hint = document.getElementById('cakeHint');
            if(!candleOut) {
                flame.style.display = 'none';
                hint.innerText = "Yayy! Lilin padam! Semoga semua doamu terkabul! 🤲✨";
                hint.style.color = "#a8ffb2";
                candleOut = true;
                triggerGoldConfetti();
            } else {
                flame.style.display = 'block';
                hint.innerText = "✨ Ketuk kue untuk meniup lilinnya! 🌬️";
                hint.style.color = "#ffd700";
                candleOut = false;
            }
        }

        // Isi Pesan 3 Kado Kejutan (Ubah Isi Pesan di Sini)
        const giftData = {
            1: {
                icon: "💎",
                title: "Voucher / Doa Spesial",
                text: "Kamu berhak mendapatkan kebahagiaan penuh sepanjang tahun ini! (Plus voucher makan/ngopi bareng bebas pilih tempat! ☕🍰)"
            },
            2: {
                icon: "📜",
                title: "Catatan Rahasia",
                text: "Ingat ya, di setiap masa sulit atau lelah, kamu selalu punya teman yang siap bantu dan dengerin cerita kamu! Stay awesome! ✨"
            },
            3: {
                icon: "👑",
                title: "Mahkota Kebahagiaan",
                text: "Semoga di usia yang baru ini, kamu makin bersinar, makin dewasa, dan semua impian besarmu tercapai satu per satu! 🌟"
            }
        };

        function openGiftModal(id) {
            const data = giftData[id];
            document.getElementById('modalIcon').innerText = data.icon;
            document.getElementById('modalTitle').innerText = data.title;
            document.getElementById('modalBody').innerText = data.text;
            document.getElementById('giftModal').style.display = 'flex';
            triggerGoldConfetti();
        }

        function closeGiftModal() {
            document.getElementById('giftModal').style.display = 'none';
        }

        // Form Wish
        function submitWish() {
            const val = document.getElementById('wishInput').value;
            const res = document.getElementById('wishDisplay');
            if(val.trim() !== "") {
                res.style.display = 'block';
                res.innerHTML = "🌟 <b>Harapanmu Telah Terabadikan:</b><br>\"" + val + "\"<br><small>Semoga dikabulkan secepatnya! 🤲✨</small>";
                document.getElementById('wishInput').value = "";
                triggerGoldConfetti();
            }
        }

        // Sparkle Confetti Effect
        function triggerGoldConfetti() {
            confetti({
                particleCount: 100,
                spread: 90,
                origin: { y: 0.6 },
                colors: ['#ffd700', '#ff69b4', '#ffffff', '#e0b0ff']
            });
        }

        // Create Ambient Background Sparkles
        const sparkleContainer = document.getElementById('sparkle-container');
        for (let i = 0; i < 30; i++) {
            let el = document.createElement('div');
            el.className = 'sparkle';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (Math.random() * 5 + 4) + 's';
            el.style.animationDelay = Math.random() * 5 + 's';
            sparkleContainer.appendChild(el);
        }
    </script>
</body>
</html>
