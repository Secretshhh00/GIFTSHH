<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun!</title>
    <style>
        /* --- GAYA / CSS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            color: #333;
        }

        /* Container Utama Card */
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 10;
            animation: fadeIn 1.5s ease-in-out;
        }

        /* Foto Ulang Tahun */
        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #ff6b81;
            box-shadow: 0 5px 15px rgba(255, 107, 129, 0.4);
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.05) rotate(3deg);
        }

        /* Judul & Teks */
        h1 {
            color: #ff4757;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .message {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 25px;
            white-space: pre-line; /* Agar enter pada teks terbaca */
        }

        /* Tombol Kejutan / Musik */
        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
            transition: background 0.3s, transform 0.2s;
        }

        .btn:hover {
            background-color: #ff6b81;
            transform: translateY(-2px);
        }

        /* Teks Kejutan Tersembunyi */
        .surprise {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #ffeaa7;
            border-radius: 10px;
            color: #d63031;
            font-weight: bold;
            animation: popIn 0.5s ease;
        }

        /* Animasi Balon di Latar Belakang */
        .balloon {
            position: absolute;
            width: 50px;
            height: 60px;
            background-color: rgba(255, 107, 129, 0.7);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            bottom: -100px;
            animation: float 8s infinite linear;
            z-index: 1;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 23px;
            width: 2px;
            height: 15px;
            background-color: #888;
        }

        /* Keyframes Animasi */
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Balon Hiasan -->
    <div class="balloon" style="left: 10%; animation-delay: 0s; background-color: #ff7675;"></div>
    <div class="balloon" style="left: 30%; animation-delay: 2s; background-color: #74b9ff;"></div>
    <div class="balloon" style="left: 50%; animation-delay: 4s; background-color: #55efc4;"></div>
    <div class="balloon" style="left: 70%; animation-delay: 1s; background-color: #ffeaa7;"></div>
    <div class="balloon" style="left: 85%; animation-delay: 3s; background-color: #a29bfe;"></div>

    <!-- Container Konten Utama -->
    <div class="container">
        
        <!-- ==================================================== -->
        <!-- 1. LOKASI UBAH FOTO (Ganti link URL di dalam src="") -->
        <!-- ==================================================== -->
        <img class="profile-img" 
             src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80" 
             alt="Foto Teman">

        <!-- ==================================================== -->
        <!-- 2. LOKASI UBAH NAMA & JUDUL                          -->
        <!-- ==================================================== -->
        <h1>Happy Birthday! 🎉</h1>

        <!-- ==================================================== -->
        <!-- 3. LOKASI UBAH UCAPAN Ulang Tahun                   -->
        <!-- ==================================================== -->
        <p class="message">
            Selamat ulang tahun ya! 🥳✨
            Semoga di usiamu yang baru ini, kamu semakin bahagia, sehat selalu, dan semua impianmu bisa tercapai.

            Makasih udah jadi teman yang luar biasa selama ini. Enjoy your special day! 🎂🎈
        </p>

        <!-- Tombol Interaktif -->
        <button class="btn" onclick="tampilkanKejutan()">Klik untuk Kejutan! 🎁</button>

        <!-- ==================================================== -->
        <!-- 4. LOKASI UBAH PESAN KEJUTAN / RAHASIA               -->
        <!-- ==================================================== -->
        <div id="surprise-text" class="surprise">
            Pesan Tambahan: Jangan lupa makan-makan & traktirannya ya! 🍕🍰😆
        </div>

    </div>

    <!-- JavaScript Interaktif -->
    <script>
        function tampilkanKejutan() {
            var surpriseDiv = document.getElementById("surprise-text");
            if (surpriseDiv.style.display === "block") {
                surpriseDiv.style.display = "none";
            } else {
                surpriseDiv.style.display = "block";
            }
        }
    </script>
</body>
</html>
