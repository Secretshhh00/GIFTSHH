<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎉✨</title>

    <!-- Canvas Confetti Library (Untuk Efek Pesta Kembang Api) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Float Elements (Balon & Bintang) */
        .floating-item {
            position: absolute;
            user-select: none;
            pointer-events: none;
            animation: floatUp linear infinite;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Container Card Utama */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
            z-index: 10;
            border: 4px solid #ffffff;
            transform: scale(0.95);
            animation: cardBounce 1s ease forwards;
        }

        @keyframes cardBounce {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }

        /* Foto Ulang Tahun dengan Ring Glow */
        .photo-wrapper {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 20px auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #ff4757;
            box-shadow: 0 0 25px rgba(255, 71, 87, 0.6);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(255, 71, 87, 0.5); transform: scale(1); }
            100% { box-shadow: 0 0 30px rgba(255, 71, 87, 0.9); transform: scale(1.03); }
        }

        /* Judul */
        h1 {
            font-family: 'Fredoka One', cursive;
            color: #ff4757;
            font-size: 2.2rem;
            text-shadow: 2px 2px 0px #ffeaa7;
            margin-bottom: 10px;
            animation: wiggle 3s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        /* Animasi Kue & Lilin Interaktif */
        .cake-container {
            margin: 20px 0;
            cursor: pointer;
            display: inline-block;
        }

        .cake {
            font-size: 70px;
            position: relative;
            display: inline-block;
            transition: transform 0.2s;
        }

        .cake:hover {
            transform: scale(1.1);
        }

        .flame {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 25px;
            animation: flicker 0.6s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 1; transform: translateX(-50%) scale(1); }
            100% { opacity: 0.7; transform: translateX(-50%) scale(1.2); }
        }

        .candle-hint {
            font-size: 0.8rem;
            color: #888;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        /* Teks Ucapan */
        .message {
            font-size: 1.05rem;
            color: #2d3436;
            line-height: 1.6;
            min-height: 80px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.6);
            padding: 15px;
            border-radius: 15px;
            border: 2px dashed #ff7675;
        }

        /* Tombol Interaktif */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.6);
        }

        .btn-music {
            background: linear-gradient(45deg, #1dd1a1, #10ac84);
            box-shadow: 0 5px 15px rgba(29, 209, 161, 0.4);
        }

        .btn-music:hover {
            box-shadow: 0 8px 20px rgba(29, 209, 161, 0.6);
        }

        /* Modal / Pesan Rahasia */
        .secret-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background-color: #ffeaa7;
            border-radius: 15px;
            color: #d63031;
            font-weight: 600;
            animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Latar Belakang Elemen Melayang -->
    <div id="floating-container"></div>

    <div class="card">
        
        <!-- ========================================================= -->
        <!-- 1. LOKASI FOTO (Ganti Link Gambar di dalam src="")         -->
        <!-- ========================================================= -->
        <div class="photo-wrapper">
            <img class="profile-img" 
                 src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80" 
                 alt="Foto Ulang Tahun">
        </div>

        <!-- ========================================================= -->
        <!-- 2. LOKASI UBAH NAMA                                       -->
        <!-- ========================================================= -->
        <h1>Happy Birthday! 🎉</h1>

        <!-- Interactive Cake -->
        <div class="cake-container" onclick="tiupLilin()">
            <div class="cake">
                <span id="flame" class="flame">🔥</span>
                🎂
            </div>
            <div class="candle-hint">(Klik kue untuk tiup lilinya! 🌬️)</div>
        </div>

        <!-- ========================================================= -->
        <!-- 3. LOKASI UBAH UCAPAN KETIK (Diubah di bagian JavaScript)  -->
        <!-- ========================================================= -->
        <div class="message" id="typewriter-text"></div>

        <div class="btn-group">
            <button class="btn btn-music" onclick="toggleMusic()">🎵 Putar Lagu Ulang Tahun</button>
            <button class="btn" onclick="sebarConfetti(); tampilkanRahasia();">🎁 Buka Pesan Kejutan!</button>
        </div>

        <!-- ========================================================= -->
        <!-- 4. LOKASI PESAN RAHASIA                                   -->
        <!-- ========================================================= -->
        <div id="secret-message" class="secret-box">
            💌 **Pesan Rahasia:** Makasih udah selalu ada ya! Jangan lupa traktirannya ditunggu minggu ini! 🍕🧋😆
        </div>
    </div>

    <!-- Audio Musik Ulang Tahun (Instrumen Ceria) -->
    <audio id="hbd-song" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a7315b.mp3?filename=happy-birthday-15220.mp3" type="audio/mpeg">
    </audio>

    <script>
        // =========================================================
        // TEKS UCAPAN DENGAN EFEK MENGETIK (UBAH DI SINI)
        // =========================================================
        const ucapanTeks = "Selamat Ulang Tahun ya! 🥳✨\nSemoga panjang umur, sehat selalu, makin sukses, dan semua cita-citamu bisa terwujud tahun ini. Makasih udah jadi temen yang selalu ada dan bisa diandelin! Enjoy your special day! 🎂🎈";

        let index = 0;
        function typeWriter() {
            if (index < ucapanTeks.length) {
                let char = ucapanTeks.charAt(index);
                document.getElementById("typewriter-text").innerHTML += char === '\n' ? '<br>' : char;
                index++;
                setTimeout(typeWriter, 40);
            }
        }
        window.onload = () => {
            typeWriter();
            sebarConfetti();
        };

        // Efek Tiup Lilin
        let lilinPadam = false;
        function tiupLilin() {
            const flame = document.getElementById('flame');
            if(!lilinPadam) {
                flame.style.display = 'none';
                lilinPadam = true;
                sebarConfetti();
                alert("Horeee! Lilinnya mati! Semoga semua doa dan harapanmu terkabul ya! 🤲✨");
            } else {
                flame.style.display = 'block';
                lilinPadam = false;
            }
        }

        // Efek Musik
        const audio = document.getElementById("hbd-song");
        let isPlaying = false;
        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                audio.play();
                isPlaying = true;
                sebarConfetti();
            }
        }

        // Efek Hujan Confetti / Kembang Api Kertas
        function sebarConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // Tampilkan Pesan Rahasia
        function tampilkanRahasia() {
            const secretBox = document.getElementById("secret-message");
            if (secretBox.style.display === "block") {
                secretBox.style.display = "none";
            } else {
                secretBox.style.display = "block";
            }
        }

        // Generate Balon & Emoji Melayang Latar Belakang
        const container = document.getElementById('floating-container');
        const items = ['🎈', '✨', '💖', '🎁', '⭐', '🌸'];
        for (let i = 0; i < 20; i++) {
            let div = document.createElement('div');
            div.className = 'floating-item';
            div.innerText = items[Math.floor(Math.random() * items.length)];
            div.style.left = Math.random() * 100 + 'vw';
            div.style.animationDuration = (Math.random() * 5 + 5) + 's';
            div.style.animationDelay = Math.random() * 5 + 's';
            div.style.fontSize = (Math.random() * 20 + 20) + 'px';
            container.appendChild(div);
        }
    </script>
</body>
</html>
