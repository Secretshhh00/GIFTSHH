<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎉 Special Surprise!</title>

    <!-- Canvas Confetti & Google Fonts -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Elements Floating Background */
        .floating-item {
            position: fixed;
            user-select: none;
            pointer-events: none;
            animation: floatUp linear infinite;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* ------------------------------------ */
        /* SESI 1: TAMPILAN KADO AWAL          */
        /* ------------------------------------ */
        #gift-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 182, 193, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
        }

        .gift-box {
            font-size: 100px;
            animation: giftShake 1.2s infinite ease-in-out;
            transition: transform 0.3s;
        }

        .gift-box:hover {
            transform: scale(1.2);
        }

        @keyframes giftShake {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-10deg); }
            40% { transform: rotate(10deg); }
            60% { transform: rotate(-5deg); }
            80% { transform: rotate(5deg); }
        }

        .gift-text {
            font-family: 'Fredoka One', cursive;
            color: #d63031;
            font-size: 1.8rem;
            margin-top: 15px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }

        /* ------------------------------------ */
        /* SESI 2: KARTU UTAMA & KONTEN        */
        /* ------------------------------------ */
        .card {
            display: none; /* Muncul setelah kado diklik */
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
            z-index: 10;
            border: 4px solid #ffffff;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Foto Ring Glow */
        .photo-wrapper {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 15px auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #ff4757;
            box-shadow: 0 0 25px rgba(255, 71, 87, 0.6);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 71, 87, 0.5); }
            100% { transform: scale(1.04); box-shadow: 0 0 30px rgba(255, 71, 87, 0.9); }
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #ff4757;
            font-size: 2.2rem;
            text-shadow: 2px 2px 0px #ffeaa7;
            margin-bottom: 10px;
        }

        /* Interactive Cake */
        .cake-box {
            background: #fff0f3;
            padding: 15px;
            border-radius: 20px;
            margin: 15px 0;
            border: 2px dashed #ff7675;
            cursor: pointer;
        }

        .cake {
            font-size: 65px;
            position: relative;
            display: inline-block;
        }

        .flame {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            animation: flicker 0.5s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 1; transform: translateX(-50%) scale(1); }
            100% { opacity: 0.6; transform: translateX(-50%) scale(1.3); }
        }

        .hint {
            font-size: 0.85rem;
            color: #d63031;
            font-weight: 600;
        }

        /* Ucapan Typewriter */
        .message-box {
            font-size: 1rem;
            color: #2d3436;
            line-height: 1.6;
            min-height: 80px;
            margin: 15px 0;
            text-align: left;
            background: #ffffff;
            padding: 15px;
            border-radius: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        /* Form Tulis Wish */
        .wish-section {
            margin-top: 20px;
            background: #ffeaa7;
            padding: 15px;
            border-radius: 15px;
        }

        .wish-section h3 {
            font-size: 1.1rem;
            color: #d63031;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 70px;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #fdcb6e;
            font-family: 'Poppins', sans-serif;
            resize: none;
            outline: none;
        }

        .btn {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4);
            margin-top: 8px;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        /* Wish Result Box */
        .wish-display {
            display: none;
            margin-top: 15px;
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            border-left: 5px solid #1dd1a1;
            font-style: italic;
            color: #10ac84;
            animation: fadeIn 0.5s;
        }

        /* Youtube Container Hidden Audio */
        #youtube-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Frame Youtube Player Musik (Hidden) -->
    <div id="youtube-player"></div>

    <!-- Background Elements Melayang -->
    <div id="floating-container"></div>

    <!-- SESI 1: LAYAR KADO UTAMA -->
    <div id="gift-screen" onclick="bukaKejutan()">
        <div class="gift-box">🎁</div>
        <div class="gift-text">Ada Kejutan Buat Kamu!<br>(Klik Kadonya 👆)</div>
    </div>

    <!-- SESI 2: KARTU ULANG TAHUN INTERAKTIF -->
    <div class="card" id="main-card">
        
        <!-- 1. LOKASI UBAH FOTO (Ganti link URL di src="") -->
        <div class="photo-wrapper">
            <img class="profile-img" 
                 src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80" 
                 alt="Foto Teman">
        </div>

        <!-- 2. LOKASI NAMA -->
        <h1>Happy Birthday! 🎉</h1>

        <!-- Sesi Tiup Lilin -->
        <div class="cake-box" onclick="tiupLilin()">
            <div class="cake">
                <span id="flame" class="flame">🔥</span>
                🎂
            </div>
            <div class="hint" id="cake-hint">👉 Klik kuenya buat tiup lilinnya! 🌬️</div>
        </div>

        <!-- 3. LOKASI UCAPAN (Ubah di Script bawah) -->
        <div class="message-box" id="typewriter-text"></div>

        <!-- SESI 3: FORM TULIS WISH / HARAPAN -->
        <div class="wish-section">
            <h3>✨ Tulis Harapan & Doamu di Sini:</h3>
            <textarea id="user-wish" placeholder="Ketik wishlist / harapanmu di umur baru ini..."></textarea>
            <button class="btn" onclick="kirimWish()">Kirim Harapan 🚀</button>
            
            <div id="wish-display" class="wish-display"></div>
        </div>

    </div>

    <!-- YouTube Iframe API Script -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // =========================================================
        // 1. SETUP MUSIK YOUTUBE (Otomatis Play pas Kado Diklik)
        // =========================================================
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                videoId: 'KnJ7oeJzXyo', // ID Video YouTube
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'KnJ7oeJzXyo'
                }
            });
        }

        // =========================================================
        // 2. UBAH TEKS UCAPAN DI SINI
        // =========================================================
        const ucapanTeks = "Selamat Ulang Tahun ya! 🥳✨\n\nSemoga di usiamu yang baru ini kamu makin bahagia, sehat selalu, makin sukses, dan semua impianmu tercapai. Makasih udah jadi sahabat yang luar biasa selama ini! Enjoy your special day! 🎂🎉";

        // Fungsi Buka Kado + Play Lagu + Confetti
        function bukaKejutan() {
            document.getElementById('gift-screen').style.display = 'none';
            document.getElementById('main-card').style.display = 'block';
            
            // Play Lagu Youtube
            if (player && player.playVideo) {
                player.playVideo();
            }

            // Hujan Confetti Meriah
            sebarConfetti();
            setTimeout(sebarConfetti, 1000);

            // Jalankan Animasi Mengetik Teks
            typeWriter();
        }

        // Animasi Mengetik
        let index = 0;
        function typeWriter() {
            if (index < ucapanTeks.length) {
                let char = ucapanTeks.charAt(index);
                document.getElementById("typewriter-text").innerHTML += char === '\n' ? '<br>' : char;
                index++;
                setTimeout(typeWriter, 35);
            }
        }

        // Fitur Tiup Lilin
        let lilinPadam = false;
        function tiupLilin() {
            const flame = document.getElementById('flame');
            const hint = document.getElementById('cake-hint');
            if(!lilinPadam) {
                flame.style.display = 'none';
                hint.innerText = "Yayy! Lilinnya berhasil ditiup! 🥳✨";
                hint.style.color = "#1dd1a1";
                lilinPadam = true;
                sebarConfetti();
            } else {
                flame.style.display = 'block';
                hint.innerText = "👉 Klik kuenya buat tiup lilinnya! 🌬️";
                hint.style.color = "#d63031";
                lilinPadam = false;
            }
        }

        // Fitur Kirim Wish
        function kirimWish() {
            const wishInput = document.getElementById('user-wish').value;
            const wishDisplay = document.getElementById('wish-display');
            
            if(wishInput.trim() !== "") {
                wishDisplay.style.display = "block";
                wishDisplay.innerHTML = "🌟 <b>Harapanmu Tersimpan:</b><br>\"" + wishInput + "\"<br><small>Aamiin... Semoga semua doamu dikabulkan ya! 🤲✨</small>";
                document.getElementById('user-wish').value = "";
                sebarConfetti();
            } else {
                alert("Tulis dulu harapanmu ya sebelum mengeklik tombol kirim! 😊");
            }
        }

        // Generater Hujan Confetti
        function sebarConfetti() {
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        // Floating Background Elements (Balon, Bintang, Love)
        const container = document.getElementById('floating-container');
        const items = ['🎈', '✨', '💖', '🎁', '⭐', '🌸', '🎉'];
        for (let i = 0; i < 22; i++) {
            let div = document.createElement('div');
            div.className = 'floating-item';
            div.innerText = items[Math.floor(Math.random() * items.length)];
            div.style.left = Math.random() * 100 + 'vw';
            div.style.animationDuration = (Math.random() * 6 + 6) + 's';
            div.style.animationDelay = Math.random() * 5 + 's';
            div.style.fontSize = (Math.random() * 20 + 20) + 'px';
            container.appendChild(div);
        }
    </script>
</body>
</html>
